    <rect width="196" height="238" rx="15" fill="url(#rack)" stroke="#87d9de" stroke-opacity=".8"/>
    <rect x="19" y="16" width="158" height="30" rx="5" fill="#163a54"/>
    <circle cx="34" cy="31" r="4" fill="#6de2cd"/>
    <path d="M47 31H88" stroke="#85b5ca" stroke-width="3" stroke-linecap="round"/>
    <use href="#unit" x="23" y="61"/><use href="#unit" x="23" y="115"/><use href="#unit" x="23" y="169"/>
